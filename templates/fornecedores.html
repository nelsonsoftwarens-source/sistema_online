{% extends 'base.html' %}

{% block conteudo %}

<div class="compras-layout">

    <!-- FORMULÁRIO -->
    <div class="compras-form">

        <h3>➕ Novo Fornecedor</h3>

        <div class="row">

            <div class="col-md-6">
                <input type="text"
                       id="nome"
                       placeholder="Nome">
            </div>

            <div class="col-md-3">
                <input type="text"
                       id="telefone"
                       placeholder="Telefone">
            </div>

            <div class="col-md-3">
                <input type="email"
                       id="email"
                       placeholder="Email">
            </div>

        </div>

        <div class="row mt-2">

            <div class="col-md-4">
                <input type="text"
                       id="documento"
                       placeholder="NUIT / Documento">
            </div>

            <div class="col-md-8">
                <textarea
                    id="endereco"
                    placeholder="Endereço">
                </textarea>
            </div>

        </div>

        <button onclick="salvarFornecedor()">
            💾 Guardar Fornecedor
        </button>

    </div>



    <!-- LISTA -->
    <div class="compras-tabela">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h3 class="mb-0">
                🏢 Lista de Fornecedores
            </h3>

            <input
                type="text"
                id="filtro-fornecedor"
                class="form-control"
                placeholder="🔎 Pesquisar fornecedor..."
                style="max-width:350px;">

        </div>

        <table>

            <thead>

                <tr>

                    <th>Nome</th>

                    <th>Telefone</th>

                    <th>Email</th>

                    <th style="width:120px; text-align:center;">
                        Ações
                    </th>

                </tr>

            </thead>

            <tbody id="tbody-fornecedores">

                {% for f in fornecedores %}

                <tr
                    ondblclick="abrirFornecedor('{{f[0]}}')"
                    data-nome="{{f[1]|lower}}">

                    <td>{{f[1]}}</td>

                    <td>{{f[2]}}</td>

                    <td>{{f[3]}}</td>

                    <td class="text-center">

                        <button
                            type="button"
                            class="btn btn-primary btn-sm"
                            onclick="event.stopPropagation(); abrirFornecedor('{{f[0]}}');">

                            Abrir

                        </button>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

<!-- MODAL -->
<div id="modalFornecedor" class="modal">

    <div class="modal-content">

        <h3>Fornecedor</h3>

        <div id="detalhesFornecedor"></div>

        <button onclick="fecharFornecedor()">
            Fechar
        </button>

    </div>

</div>

<script>

function salvarFornecedor(){

    fetch("/api/fornecedor",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({

            nome:
                document.getElementById("nome").value,

            telefone:
                document.getElementById("telefone").value,

            email:
                document.getElementById("email").value,

            endereco:
                document.getElementById("endereco").value,

            documento:
                document.getElementById("documento").value
        })
    })
    .then(r=>r.json())
    .then(d=>{

        if(d.status==="ok"){

            alert("Fornecedor registado");

            location.reload();

        }else{

            alert(d.error);
        }

    });
}

function abrirFornecedor(id){

    fetch("/api/fornecedor/"+id)
    .then(r=>r.json())
    .then(d=>{

        document.getElementById("detalhesFornecedor").innerHTML = `
            <p><b>Nome:</b> ${d.nome}</p>
            <p><b>Telefone:</b> ${d.telefone || ""}</p>
            <p><b>Email:</b> ${d.email || ""}</p>
            <p><b>Documento:</b> ${d.documento || ""}</p>
            <p><b>Endereço:</b> ${d.endereco || ""}</p>
        `;

        document.getElementById("modalFornecedor")
            .style.display="flex";
    });
}

function fecharFornecedor(){

    document.getElementById("modalFornecedor")
        .style.display="none";
}

document.getElementById("filtro-fornecedor")
.addEventListener("keyup", function(){

    let filtro = this.value.toLowerCase();

    document.querySelectorAll(
        "#tbody-fornecedores tr"
    ).forEach(linha=>{

        linha.style.display =
            linha.dataset.nome.includes(filtro)
            ? ""
            : "none";
    });
});

</script>

{% endblock %}
