{% extends 'base.html' %}

{% block conteudo %}

<div class="topo-pagina">
    <h2>💰 Vendas Online</h2>
</div>

<!-- ====================================== -->
<!-- FILTROS -->
<!-- ====================================== -->

<div class="painel">

    <form method="GET" style="display:flex; gap:10px; flex-wrap:wrap;">

        <input type="date"
               name="data_inicio"
               class="campo-busca-inline">

        <input type="date"
               name="data_fim"
               class="campo-busca-inline">

        <input type="text"
               name="produto"
               class="campo-busca-inline"
               placeholder="🔎 Produto">

        <input type="text"
               name="ticket"
               class="campo-busca-inline"
               placeholder="🎫 Ticket">

        <button type="submit" class="btn">
            Filtrar
        </button>

    </form>

</div>

<!-- ====================================== -->
<!-- BUSCA RÁPIDA -->
<!-- ====================================== -->

<div class="painel">

    <input type="text"
           id="buscaVenda"
           class="campo-busca-inline"
           placeholder="🔎 Buscar venda...">

</div>

<!-- ====================================== -->
<!-- TABELA -->
<!-- ====================================== -->

<div class="painel">

    <table id="tabelaVendas">

        <thead>

            <tr>

                <th>ID</th>
                <th>Item</th>
                <th>Cliente</th>
                <th>Total</th>
                <th>Ticket</th>
                <th>Pagamento</th>
                <th>Data</th>

            </tr>

        </thead>

        <tbody>

            {% for v in vendas %}

            <tr>

                <td>{{ v[0] }}</td>

                <td>{{ v[1] }}</td>

                <td>{{ v[2] }}</td>

                <td>
                    <strong>
                        {{ v[3] }} MT
                    </strong>
                </td>

                <td>#{{ v[4] }}</td>

                <td>{{ v[6] }}</td>

                <td>{{ v[5] }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

<!-- ====================================== -->
<!-- BUSCA DINÂMICA -->
<!-- ====================================== -->

<script>

document.getElementById("buscaVenda").addEventListener("keyup", function(){

    let texto = this.value.toLowerCase();

    let linhas = document.querySelectorAll("#tabelaVendas tbody tr");

    linhas.forEach(function(linha){

        let conteudo = linha.innerText.toLowerCase();

        if(conteudo.includes(texto)){
            linha.style.display = "";
        } else {
            linha.style.display = "none";
        }

    });

});

</script>

{% endblock %}
