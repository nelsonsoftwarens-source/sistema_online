{% extends 'base.html' %}

{% block conteudo %}

<div class="stock-layout">

    <!-- ========================= -->
    <!-- FILTROS -->
    <!-- ========================= -->
    <div class="stock-filtros">

        <h2>📦 Stock</h2>

        <!-- PRODUTO -->
        <input type="text"
               id="filtro-produto"
               placeholder="🔎 Procurar produto..."
               class="campo-busca">

        <!-- ARMAZÉM -->
        <select id="filtro-armazem" class="campo-busca">

            <option value="">
                Todos os Armazéns
            </option>

            {% for a in armazens %}
            <option value="{{ a[0]|lower }}">
                {{ a[0] }}
            </option>
            {% endfor %}

        </select>

        <!-- DATAS -->
        <div style="display:flex; gap:10px; margin-top:10px;">

            <input type="date" id="data-inicio">
            <input type="date" id="data-fim">

        </div>

        <button onclick="limparFiltros()">
            🔄 Limpar
        </button>

    </div>

    <!-- ========================= -->
    <!-- TABELA -->
    <!-- ========================= -->
    <div class="stock-tabela">

        <table>

            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Armazém</th>
                    <th>Qtd</th>
                    <th>Última Atualização</th>
                </tr>
            </thead>

            <tbody id="tbody-stock">

                {% for s in stock %}

                <tr class="linha-stock"
                    data-produto="{{ s[1]|lower }}"
                    data-armazem="{{ s[2]|lower }}"
                    data-data="{{ s[4] }}">

                    <td>{{ s[1] }}</td>
                    <td>{{ s[2] }}</td>
                    <td>{{ s[3] }}</td>
                    <td>{{ s[4] }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

<script>

function filtrarStock(){

    let produto =
        document.getElementById("filtro-produto")
        .value
        .toLowerCase();

    let armazem =
        document.getElementById("filtro-armazem")
        .value
        .toLowerCase();

    let dataInicio =
        document.getElementById("data-inicio").value;

    let dataFim =
        document.getElementById("data-fim").value;

    let linhas =
        document.querySelectorAll(".linha-stock");

    linhas.forEach(l => {

        let p = l.dataset.produto;
        let a = l.dataset.armazem;
        let d = l.dataset.data;

        let okProduto = p.includes(produto);

        let okArmazem =
            armazem === "" ||
            a === armazem;

        let okData = true;

        if(dataInicio && d){
            if(d.substring(0,10) < dataInicio){
                okData = false;
            }
        }

        if(dataFim && d){
            if(d.substring(0,10) > dataFim){
                okData = false;
            }
        }

        if(okProduto && okArmazem && okData){
            l.style.display = "";
        }else{
            l.style.display = "none";
        }

    });

}

document
.getElementById("filtro-produto")
.addEventListener("input", filtrarStock);

document
.getElementById("filtro-armazem")
.addEventListener("change", filtrarStock);

document
.getElementById("data-inicio")
.addEventListener("change", filtrarStock);

document
.getElementById("data-fim")
.addEventListener("change", filtrarStock);

function limparFiltros(){

    document.getElementById("filtro-produto").value = "";
    document.getElementById("filtro-armazem").value = "";
    document.getElementById("data-inicio").value = "";
    document.getElementById("data-fim").value = "";

    filtrarStock();
}

</script>

{% endblock %}
