{% extends 'base.html' %}

{% block conteudo %}

<style>

.compras-layout{
    display:flex;
    gap:20px;
    padding:20px;
}

/* ================= FILTROS ================= */

.compras-filtros{
    width:260px;
    background:#fff;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.compras-filtros h2{
    margin-bottom:15px;
}

.campo-filtro{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ddd;
    border-radius:6px;
}

/* ================= FORM ================= */

.compras-form{
    width:320px;
    background:#fff;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.compras-form h3{
    margin-bottom:15px;
}

.compras-form select,
.compras-form input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ddd;
    border-radius:6px;
}

.btn-salvar{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#28a745;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-salvar:hover{
    background:#218838;
}

/* ================= TABELA ================= */

.compras-tabela{
    flex:1;
    background:#fff;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#f8f9fa;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

tbody tr:hover{
    background:#f5f5f5;
    cursor:pointer;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    width:700px;
    max-width:95%;
    background:#fff;
    border-radius:10px;
    padding:20px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.fechar{
    cursor:pointer;
    font-size:22px;
    font-weight:bold;
}

</style>

<div class="compras-layout">

    <!-- ================= FILTROS ================= -->

    <div class="compras-filtros">

        <h2>🛒 Compras</h2>

        <input
            type="text"
            id="filtro-fornecedor"
            class="campo-filtro"
            placeholder="Fornecedor">

        <input
            type="date"
            id="filtro-data"
            class="campo-filtro">

        <!-- ================= CARRINHO DE ITENS ================= -->
        <h3>📦 Itens da Compra</h3>

        <table id="tabela-itens-temp">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Qtd</th>
                    <th>Unit</th>
                    <th>Total</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody></tbody>
        </table>

        <button
            class="btn-salvar"
            onclick="salvarCompra()">

            💾 Registar Compra

        </button>

    </div>

    <!-- ================= FORM ================= -->

    <div class="compras-form">


        <h4>Nova Compra</h4>

        <select id="fornecedor">

            <option value="">
                Selecione Fornecedor
            </option>

            {% for f in fornecedores %}
            <option value="{{f[0]}}">
                {{f[1]}}
            </option>
            {% endfor %}

        </select>

        <select id="produto">

            <option value="">
                Selecione Produto
            </option>

            {% for p in produtos %}
            <option value="{{p[0]}}">
                {{p[1]}}
            </option>
            {% endfor %}

        </select>

        <select id="armazem">

            <option value="">
                Selecione Armazém
            </option>

            {% for a in armazens %}
            <option value="{{a[0]}}">
                {{a[1]}}
            </option>
            {% endfor %}

        </select>

        <input
            type="number"
            id="quantidade"
            placeholder="Quantidade">

        <input
            type="number"
            id="valor_unit"
            step="0.01"
            placeholder="Valor Unitário">

        <input
            type="number"
            id="valor_total"
            step="0.01"
            placeholder="Valor Total">

        
        <button type="button" onclick="adicionarItem()">
            ➕ Adicionar Produto
        </button>

    </div>

    <!-- ================= HISTÓRICO ================= -->

    <div class="compras-tabela">

        <table>

            <thead>
                <tr>
                    <th>Fornecedor</th>
                    <th>Data</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody id="tabela-compras">

                {% for c in compras %}

                <tr
                    data-fornecedor="{{ c[1]|lower }}"
                    data-data="{{ c[2] }}"
                    ondblclick="abrirCompra('{{c[0]}}')">

                    <td>{{ c[1] }}</td>
                    <td>{{ c[2] }}</td>
                    <td>{{ c[3] }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

<!-- ================= MODAL ================= -->

<div class="modal" id="modalCompra">

    <div class="modal-content">

        <div class="modal-header">

            <h3>Detalhes da Compra</h3>

            <span
                class="fechar"
                onclick="fecharModal()">

                ×

            </span>

        </div>

        <div id="conteudoCompra"></div>

    </div>

</div>

<script>
function salvarCompra(){

    let fornecedor = document.getElementById("fornecedor").value;
    let produto_uuid = document.getElementById("produto").value;
    let armazem_uuid = document.getElementById("armazem").value;
    let quantidade = parseFloat(document.getElementById("quantidade").value || 0);
    let valor_unit = parseFloat(document.getElementById("valor_unit").value || 0);
    let valor_total = parseFloat(document.getElementById("valor_total").value || 0);

    console.log("========== COMPRA ==========");
    console.log("Fornecedor:", fornecedor);
    console.log("Produto UUID:", produto_uuid);
    console.log("Armazem UUID:", armazem_uuid);
    console.log("Quantidade:", quantidade);
    console.log("Valor Unit:", valor_unit);
    console.log("Valor Total:", valor_total);

    if(!fornecedor){
        alert("Selecione o fornecedor");
        return;
    }

    if(!produto_uuid){
        alert("Selecione o produto");
        return;
    }

    if(!armazem_uuid){
        alert("Selecione o armazém");
        return;
    }

    const payload = {

        fornecedor: fornecedor,

        armazem_uuid: armazem_uuid,

        itens: [
            {
                produto_uuid: produto_uuid,
                quantidade: quantidade,
                valor_unit: valor_unit,
                valor_total: valor_total
            }
        ]

    };

    console.log("PAYLOAD:");
    console.log(payload);

    fetch("/api/salvar_compras",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify(payload)
    })
    .then(async r => {

        let dados = await r.json();

        console.log("STATUS:", r.status);
        console.log("RESPOSTA:", dados);

        return dados;
    })
    .then(d => {

        if(d.status === "ok"){

            alert("Compra registada com sucesso");

            location.reload();

        }else{

            alert(d.error || "Erro ao gravar compra");

        }

    })
    .catch(err => {

        console.error("ERRO FETCH:", err);

        alert("Erro de comunicação com o servidor");

    });

}

function abrirCompra(registro_id){

    console.log("ABRIR COMPRA:", registro_id);

    fetch("/api/compra/" + registro_id)

    .then(async r => {

        let dados = await r.json();

        console.log("DETALHES:", dados);

        return dados;

    })

    .then(dados => {

        let html = `
            <table style="width:100%;border-collapse:collapse;">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Qtd</th>
                        <th>Valor Unit.</th>
                        <th>Total</th>
                        <th>Armazém</th>
                    </tr>
                </thead>
                <tbody>
        `;

        dados.forEach(item => {

            html += `
                <tr>
                    <td>${item.produto || ""}</td>
                    <td>${item.quantidade || 0}</td>
                    <td>${item.valor_unit || 0}</td>
                    <td>${item.valor_total || 0}</td>
                    <td>${item.armazem || ""}</td>
                </tr>
            `;

        });

        html += `
                </tbody>
            </table>
        `;

        document.getElementById("conteudoCompra").innerHTML = html;

        document.getElementById("modalCompra").style.display = "flex";

    })

    .catch(err => {

        console.error("ERRO DETALHE COMPRA:", err);

        alert("Erro ao carregar detalhes da compra");

    });

}

function fecharModal(){

    document.getElementById("modalCompra").style.display = "none";

}

/* ================= FILTROS ================= */

document.getElementById("filtro-fornecedor")
.addEventListener("keyup", filtrarCompras);

document.getElementById("filtro-data")
.addEventListener("change", filtrarCompras);

function filtrarCompras(){

    let fornecedor =
        document.getElementById("filtro-fornecedor")
        .value
        .toLowerCase();

    let data =
        document.getElementById("filtro-data")
        .value;

    document.querySelectorAll("#tabela-compras tr")
    .forEach(linha => {

        let fornecedorLinha =
            linha.dataset.fornecedor;

        let dataLinha =
            linha.dataset.data;

        let mostrar = true;

        if(
            fornecedor &&
            !fornecedorLinha.includes(fornecedor)
        ){
            mostrar = false;
        }

        if(
            data &&
            !String(dataLinha).includes(data)
        ){
            mostrar = false;
        }

        linha.style.display =
            mostrar ? "" : "none";

    });

}


let bloqueio = false;

/* ================= NOVO: CÁLCULO UNITÁRIO/TOTAL ================= */
document.getElementById("valor_unit").addEventListener("input", function () {

    if (bloqueio) return;

    let qtd = parseFloat(document.getElementById("quantidade").value || 0);
    let unit = parseFloat(this.value || 0);

    if (qtd > 0 && unit > 0) {

        bloqueio = true;

        document.getElementById("valor_total").value =
            (qtd * unit).toFixed(2);

        bloqueio = false;
    }
});

document.getElementById("valor_total").addEventListener("input", function () {

    if (bloqueio) return;

    let qtd = parseFloat(document.getElementById("quantidade").value || 0);
    let total = parseFloat(this.value || 0);

    if (qtd > 0 && total > 0) {

        bloqueio = true;

        document.getElementById("valor_unit").value =
            (total / qtd).toFixed(2);

        bloqueio = false;
    }
});

document.getElementById("quantidade").addEventListener("input", function () {

    let unit = parseFloat(document.getElementById("valor_unit").value || 0);
    let total = parseFloat(document.getElementById("valor_total").value || 0);
    let qtd = parseFloat(this.value || 0);

    if (qtd > 0) {

        if (unit > 0) {
            document.getElementById("valor_total").value =
                (unit * qtd).toFixed(2);
        }

        if (total > 0 && !unit) {
            document.getElementById("valor_unit").value =
                (total / qtd).toFixed(2);
        }
    }
});

let itensCompra = [];

function adicionarItem(){

    let produtoSelect = document.getElementById("produto");
    let produto_uuid = produtoSelect.value;
    let produto_nome = produtoSelect.options[produtoSelect.selectedIndex].text;

    let qtd = parseFloat(document.getElementById("quantidade").value);
    let unit = parseFloat(document.getElementById("valor_unit").value);
    let total = parseFloat(document.getElementById("valor_total").value);

    if(!produto_uuid || !qtd){
        alert("Preencha produto e quantidade");
        return;
    }

    itensCompra.push({
        produto_uuid,
        produto_nome,
        quantidade: qtd,
        valor_unit: unit,
        valor_total: total
    });

    renderTabela();
}

function renderTabela(){

    let tbody = document.querySelector("#tabela-itens-temp tbody");
    tbody.innerHTML = "";

    itensCompra.forEach((item, index) => {

        tbody.innerHTML += `
            <tr>
                <td>${item.produto_nome}</td>
                <td>${item.quantidade}</td>
                <td>${item.valor_unit || 0}</td>
                <td>${item.valor_total || 0}</td>
                <td>
                    <button onclick="removerItem(${index})">X</button>
                </td>
            </tr>
        `;
    });
}

function removerItem(i){
    itensCompra.splice(i,1);
    renderTabela();
}

function salvarCompra(){

    fetch("/api/salvar_compras",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({

            fornecedor:
                document.getElementById("fornecedor").value,

            armazem_uuid:
                document.getElementById("armazem").value,

            itens: itensCompra

        })
    })
    .then(r=>r.json())
    .then(d=>{

        if(d.status==="ok"){
            alert("Compra registada");
            location.reload();
        }else{
            alert(d.error);
        }

    });
}

</script>

{% endblock %}
