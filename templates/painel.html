{% extends 'base.html' %}

{% block conteudo %}

<div class="topo-pagina">
    <h2>📊 Painel Geral</h2>
</div>

<!-- ====================================== -->
<!-- FILTROS -->
<!-- ====================================== -->

<div class="filtros">

    <form method="GET" action="/painel" class="form-filtros">

        <div>
            <label>Data Início</label>
            <input type="date" name="inicio"
                   value="{{ request.args.get('inicio','') }}">
        </div>

        <div>
            <label>Data Fim</label>
            <input type="date" name="fim"
                   value="{{ request.args.get('fim','') }}">
        </div>

        <div>
            <label>Usuário</label>
            <input type="text" name="usuario"
                   placeholder="Filtrar usuário"
                   value="{{ request.args.get('usuario','') }}">
        </div>

        <button type="submit">🔎 Filtrar</button>

    </form>

</div>

<!-- ====================================== -->
<!-- CARD TOTAL VENDAS -->
<!-- ====================================== -->

<div class="cards">

    <div class="card destaque">
        <h3>💰 Total Vendas</h3>
        <span>
            {{ (total_vendas or 0)|float|round(2) }}
        </span>
    </div>

</div>

<!-- ====================================== -->
<!-- VENDAS POR UTILIZADOR -->
<!-- ====================================== -->

<div class="painel">

    <h3>👥 Vendas por Utilizador</h3>

    <table>

        <thead>
            <tr>
                <th>Usuário</th>
                <th>Total Vendido</th>
            </tr>
        </thead>

        <tbody>

            {% for u, t in vendas_por_usuario %}

            <tr>

                <td>{{ u or "Desconhecido" }}</td>

                <td>
                    {{ (t or 0)|float|round(2) }}
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
