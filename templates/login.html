<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            font-family: Arial;
            background: #1d4ed8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #1d4ed8;
            color: white;
            border: none;
        }
    </style>

</head>

<body>

<div class="box">

    <h2>Login ERP</h2>

    <form method="POST">

        <input type="email" name="email" placeholder="Email">
        <input type="password" name="senha" placeholder="Senha">

        <button type="submit">
            Entrar
        </button>

    </form>

</div>

</body>

</html>
